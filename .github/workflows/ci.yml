name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar y verificar
        run: ./mvnw -B verify

      - name: El contrato OpenAPI está actualizado
        run: diff -u ../frontend/src/app/core/api/openapi.json target/openapi.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Los tipos TypeScript están actualizados
        run: |
          pnpm generate:api
          git diff --exit-code -- src/app/core/api/api-types.ts

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test:ci

      - name: Build
        run: pnpm build
