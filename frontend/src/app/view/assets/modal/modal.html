@if (show()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="gda-modal-title"
  >
    <button
      type="button"
      class="absolute inset-0 h-full w-full cursor-default"
      aria-label="Cerrar"
      (click)="onClose()"
    ></button>
    <div
      class="relative z-10 w-full max-w-[50rem] max-h-[90vh] overflow-y-auto rounded-xl bg-surface-container-lowest p-6 shadow-2xl"
    >
      <div class="mb-4 flex items-start justify-between gap-3">
        <h2 id="gda-modal-title" class="font-headline-sm text-headline-sm font-bold text-primary">
          {{ title() }}
        </h2>
        <button
          type="button"
          class="rounded-lg p-1 text-on-surface-variant transition-colors hover:bg-surface-container hover:text-primary disabled:cursor-not-allowed disabled:opacity-40"
          aria-label="Cerrar"
          [disabled]="busy()"
          (click)="onClose()"
        >
          <span class="material-symbols-outlined text-xl">close</span>
        </button>
      </div>

      <div class="grid gap-space-lg">
        <div class="col-span-12 lg:col-span-8 space-y-space-lg">
          <div
            class="bg-surface-container-lowest border border-outline-variant shadow-sm p-space-lg"
          >
            <ng-content select=".form-title"></ng-content>

            <ng-content select=".form-body"></ng-content>
          </div>

          <div class="flex justify-end gap-2 mt-4">
            <button
              type="button"
              (click)="onClose()"
              [disabled]="busy()"
              class="px-4 py-2 bg-gray-300 rounded transition-colors hover:bg-gray-400 disabled:cursor-not-allowed disabled:opacity-50"
            >
              Cancelar
            </button>
            <button
              type="submit"
              [disabled]="busy()"
              class="px-4 py-2 bg-primary text-white rounded transition-all hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-60 flex items-center justify-center gap-2 min-w-[7rem]"
            >
              @if (busy()) {
                <span
                  class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
                  aria-hidden="true"
                ></span>
                Guardando…
              } @else {
                Guardar
              }
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
}
