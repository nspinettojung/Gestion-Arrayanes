spring.application.name=Arrayanes

# Perfil por defecto: produccion/escritorio (el jar abre el navegador en modo app).
# El desarrollo web se activa explicitamente con los perfiles dev,webdev.
spring.profiles.default=prod

# Base de datos local en archivo dentro del proyecto
spring.datasource.url=jdbc:h2:file:./datos/mibasedatos
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# El esquema se administra con migraciones versionadas de Flyway.
# baseline-on-migrate permite adoptar bases existentes sin recrearlas:
# se marcan en la version 1 y solo se aplican las migraciones posteriores.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema previo a Flyway

# Origenes permitidos por CORS (frontend Angular en desarrollo)
arrayanes.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# Hibernate ya no modifica el esquema: solo valida que coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# La aplicacion es de escritorio: solo acepta conexiones desde esta PC
server.address=127.0.0.1
server.port=0
