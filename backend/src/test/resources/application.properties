spring.application.name=Arrayanes

# Perfil de tests: evita que se active el perfil dev y se use la base real
spring.profiles.active=test

# Base de datos en memoria para tests: nunca toca datos/mibasedatos
spring.datasource.url=jdbc:h2:mem:arrayanes-test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# El esquema se construye con las mismas migraciones que produccion
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# Evita abrir el navegador y publicar el puerto durante los tests
arrayanes.desktop.enabled=false

server.port=0

# Copias de seguridad: directorio aislado y sin job diario durante los tests.
arrayanes.backup.directory=./target/test-backups
arrayanes.backup.scheduler.enabled=false
