<div class="">
  <div
    class="grow bg-surface-container-lowest border border-outline-variant rounded-2xl shadow-sm overflow-hidden flex flex-col"
  >
    <div
      class="metal-gradient px-space-md py-3 border-b border-outline-variant flex justify-between items-center"
    >
      <h2
        class="font-headline-sm text-sm font-bold uppercase tracking-wider text-on-surface-variant"
      >
        {{ title() }}
      </h2>
      <!-- agregar ng-template -->
      <ng-content select="[add-button]"></ng-content>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead class="bg-surface-container text-on-surface-variant font-label-md uppercase">
          <ng-content select="[column-header]"></ng-content>
        </thead>
        <tbody class="divide-y divide-outline-variant">
          <ng-content select="[table-body]"></ng-content>
        </tbody>
      </table>
    </div>
    <div
      class="metal-gradient px-space-md py-3 border-t border-outline-variant flex items-center justify-between"
    >
      <!-- <span class="text-xs text-on-surface-variant font-medium"
        >Mostrando 1-10 de 1,248 resultados</span
      > -->
      <div class="flex items-center gap-1">
        <button
          class="p-1 border border-outline-variant rounded bg-surface hover:bg-surface-container transition-all active:scale-95"
          (click)="setPage(currentPage() - 1)"
          [disabled]="currentPage() === 0"
        >
          <span class="material-symbols-outlined text-sm">chevron_left</span>
        </button>
        @for (page of [].constructor(totalPages()); track $index; let i = $index) {
          <button
            class="px-3 py-1 border border-outline-variant rounded text-xs font-medium hover:bg-surface-container transition-all"
            (click)="setPage(i)"
          >
            {{ i + 1 }}
          </button>
        }
        <button
          class="p-1 border border-outline-variant rounded bg-surface hover:bg-surface-container transition-all active:scale-95"
          (click)="setPage(currentPage() + 1)"
        >
          <span class="material-symbols-outlined text-sm">chevron_right</span>
        </button>
      </div>
    </div>
  </div>
</div>
